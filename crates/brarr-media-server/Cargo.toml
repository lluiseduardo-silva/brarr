[package]
name = "brarr-media-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# No `form`/`multipart` here, unlike the download clients: Plex answers
# JSON to a bare GET and Emby/Jellyfin take a JSON body. The Plex sign-in
# is the only POST, and it carries its parameters in the query string.
reqwest = { version = "0.13.3", default-features = false, features = ["json", "default-tls", "http2", "charset", "query", "gzip"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tracing = "0.1.44"
url = "2.5.8"

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt", "rt-multi-thread"] }
wiremock = "0.6.5"
