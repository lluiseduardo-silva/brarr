[package]
name = "brarr-download-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# `form` is what carries the qBittorrent login POST — in reqwest 0.13
# `RequestBuilder::form` sits behind its own feature, unlike `json`.
# `multipart` carries the .torrent / .nzb upload: both clients take the
# file as a form part, not as a JSON body.
reqwest = { version = "0.13.3", default-features = false, features = ["json", "form", "multipart", "default-tls", "http2", "charset", "query", "gzip"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
# The torrent infohash is SHA-1 of the bencoded `info` dict — the
# identity every torrent client keys on. See `src/infohash.rs`.
sha1 = "0.10.6"
thiserror = "2.0.18"
tokio = { version = "1.52.3", default-features = false, features = ["sync"] }
tracing = "0.1.44"
url = "2.5.8"

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt", "rt-multi-thread"] }
wiremock = "0.6.5"
